defaults:
  - optimizer: adamw
  - detector: ap-ood
  - _self_

_target_: ap_ood_experiments.method.ap_ood_oe.APOODOEMethod
device: ${device}
batch_size: 512
n_steps: 1000
n_queries: 1
n_heads:
  _target_: operator.floordiv
  _args_: 
    - ${d_embedding}
    - ${method.n_queries}
n_features: ${d_embedding}
beta: 1.
use_scheduler: true
lamb: 10.
average_dimensions: true
normalization: false
standardize_inputs: false
init_std: feature_dim
static_batch: false
num_workers: 0
max_mean_batches: null

optimizer:
  lr: 0.01
